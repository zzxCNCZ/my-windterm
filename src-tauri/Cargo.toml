[package]
name = "my-windterm"
version = "1.1.3"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
portable-pty = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "socks"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "macros"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.28", features = ["process", "signal"] }
futures-util = { version = "0.3", default-features = false }
openssh-sftp-client = "0.15"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation"] }
