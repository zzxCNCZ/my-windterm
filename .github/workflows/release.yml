name: Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag (for example v1.1.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: my-windterm-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TAG: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch ]]; then
            tag="$MANUAL_TAG"
          elif [[ "$GITHUB_REF_TYPE" = tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(jq -er .version src-tauri/tauri.conf.json)"
            tag="v$version"
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              tag="$version"
            fi
          fi
          [[ "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ "$GITHUB_REF_TYPE" = branch && "$GITHUB_EVENT_NAME" = push ]]; then
              exit 0
            fi
            echo "::error::Tag $tag does not exist."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: aarch64-apple-darwin
            bundles: app,dmg
            installer_dir: dmg
            name: macos-arm64
            extension: dmg
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            installer_dir: nsis
            name: windows-x64
            extension: exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust
        run: rustup show && rustup target add "${{ matrix.target }}"
      - name: Verify tag and application versions
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installer and sign update artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          : "${TAURI_SIGNING_PRIVATE_KEY:?Set the repository's Tauri updater signing secrets first.}"
          npm run tauri -- build --config src-tauri/tauri.release.conf.json --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify macOS executable architecture
        if: runner.os == 'macOS'
        run: lipo src-tauri/target/${{ matrix.target }}/release/my-windterm -verify_arch arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.installer_dir }}/*.${{ matrix.extension }}
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.installer_dir }}/*.${{ matrix.extension }}.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
      - name: Publish both installers and the signed update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          shopt -s nullglob globstar
          mac=(installers/macos-arm64/**/*.dmg)
          mac_update=(installers/macos-arm64/**/*.app.tar.gz)
          win=(installers/windows-x64/**/*.exe)
          if [[ ${#mac[@]} -ne 1 || ${#mac_update[@]} -ne 1 || ${#win[@]} -ne 1 ]]; then
            echo "::error::Expected one ARM64 DMG, one macOS update archive and one x64 NSIS installer."
            exit 1
          fi
          if [[ ! -s "${mac_update[0]}.sig" || ! -s "${win[0]}.sig" ]]; then
            echo "::error::Both updater signatures are required to publish the release."
            exit 1
          fi
          mac_name="My-WindTerm-${RELEASE_TAG}-macos-arm64.app.tar.gz"
          win_name="My-WindTerm-${RELEASE_TAG}-windows-x64-setup.exe"
          mv "${mac[0]}" "My-WindTerm-${RELEASE_TAG}-macos-arm64.dmg"
          mv "${mac_update[0]}" "$mac_name"
          mv "${mac_update[0]}.sig" "$mac_name.sig"
          mv "${win[0]}" "$win_name"
          mv "${win[0]}.sig" "$win_name.sig"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          jq -n --arg version "${RELEASE_TAG#v}" \
            --arg macUrl "$base/$mac_name" --rawfile macSignature "$mac_name.sig" \
            --arg winUrl "$base/$win_name" --rawfile winSignature "$win_name.sig" \
            '{version: $version, platforms: {
              "darwin-aarch64": {url: $macUrl, signature: ($macSignature | rtrimstr("\n") | rtrimstr("\r"))},
              "windows-x86_64": {url: $winUrl, signature: ($winSignature | rtrimstr("\n") | rtrimstr("\r"))}
            }}' > latest.json
          sha256sum My-WindTerm-* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" My-WindTerm-* latest.json SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "My WindTerm $RELEASE_TAG" --generate-notes
